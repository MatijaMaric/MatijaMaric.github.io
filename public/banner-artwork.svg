<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(37,99,235,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(30,64,175,0.2);stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background grid -->
  <rect width="1920" height="600" fill="url(#grid)"/>
  
  <!-- Abstract geometric shapes -->
  <circle cx="200" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="200" cy="100" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <rect x="1600" y="400" width="120" height="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" transform="rotate(45 1660 460)"/>
  
  <!-- Circuit-like connections -->
  <path d="M 100 300 L 300 300 L 300 200" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="300" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="300" cy="200" r="4" fill="rgba(255,255,255,0.15)"/>
  
  <path d="M 1500 100 L 1700 100 L 1700 250" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
  <circle cx="1500" cy="100" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="1700" cy="250" r="4" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Code brackets -->
  <text x="400" y="150" font-family="monospace" font-size="120" fill="rgba(255,255,255,0.05)" font-weight="bold">&lt;/&gt;</text>
  
  <!-- Binary code pattern -->
  <text x="800" y="500" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.04)" letter-spacing="4">01001101 01000001 01010100 01001001 01001010 01000001</text>
  
  <!-- Hexagons -->
  <polygon points="1200,50 1240,75 1240,125 1200,150 1160,125 1160,75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <polygon points="1200,350 1240,375 1240,425 1200,450 1160,425 1160,375" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Dots pattern -->
  <circle cx="600" cy="80" r="3" fill="rgba(255,255,255,0.1)"/>
  <circle cx="650" cy="80" r="3" fill="rgba(255,255,255,0.1)"/>
  <circle cx="700" cy="80" r="3" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Additional geometric elements -->
  <path d="M 900 400 L 950 350 L 1000 400 L 950 450 Z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <line x1="50" y1="450" x2="250" y2="450" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
  <line x1="50" y1="480" x2="200" y2="480" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
  
  <!-- Triangular elements -->
  <polygon points="1400,300 1450,350 1350,350" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
</svg>
